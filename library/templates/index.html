<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#101319" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
  <title>Glovebox Archive</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/glovebox.css"><link rel="stylesheet" href="/static/library.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <!-- the brand mark; its colors come from --logo-* (the inverse on dark surfaces) -->
    <symbol id="logo" viewBox="0 0 48 48"><rect width="48" height="48" rx="14" style="fill:var(--logo-box)"/><path d="M12 21L24 27L36 21V32L24 38L12 32Z" style="fill:var(--logo-base)"/><path d="M11 16L23 10L28 16L16 22Z" style="fill:var(--logo-base)"/><path d="M25 10L37 16L32 22L20 16Z" style="fill:var(--logo-flap)"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.4 7.5 9.5 4.4-1.1 7.5-4.9 7.5-9.5V6z"/><circle cx="12" cy="11.5" r="2.5"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="13" r="1"/><circle cx="16.5" cy="13" r="1"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-usb" viewBox="0 0 24 24"><path d="M12 3v14M9 6l3-3 3 3M8 11v2l4 3M16 9v3l-4 3"/><circle cx="12" cy="19" r="2"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/><path d="m9.5 13 2.5 2.5 2.5-2.5M12 10v5.5"/></symbol>
    <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 14h18"/><circle cx="17" cy="16.5" r=".8"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 5 13h6l-1 9 8-11h-6z"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16m0 4v-4h-4"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 14h4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6v12L9 12zM6 6v12" /></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6v12l9-6zM18 6v12"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.26 9.75 21.8 10v4l-2.54.25-.54 1.3 1.61 1.98-2.8 2.8-1.98-1.61-1.3.54L14 21.8h-4l-.25-2.54-1.3-.54-1.98 1.61-2.8-2.8 1.61-1.98-.54-1.3L2.2 14v-4l2.54-.25.54-1.3-1.61-1.98 2.8-2.8 1.98 1.61 1.3-.54L10 2.2h4l.25 2.54 1.3.54 1.98-1.61 2.8 2.8-1.61 1.98z"/><circle cx="12" cy="12" r="3.2"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
        <span class="wordmark">glovebox<span class="dot">.</span></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-nav="overview"><svg><use href="#i-home"/></svg><span>Overview</span></a>
        <a href="#/sentry" data-nav="sentry"><svg><use href="#i-shield"/></svg><span>Sentry</span></a>
        <a href="#/saved" data-nav="saved"><svg><use href="#i-bookmark"/></svg><span>Saved</span></a>
        <a href="#/recent" data-nav="recent"><svg><use href="#i-film"/></svg><span>Recent</span></a>
        <a href="#/kept" data-nav="kept"><svg><use href="#i-check"/></svg><span>Kept</span></a>
        <a href="#/sources" data-nav="sources"><svg><use href="#i-cloud"/></svg><span>Sources</span></a>
      </nav>
      <div class="sidebar-foot" id="foot"><div>Self-hosted archive</div><div>Glovebox 0.6 viewer · GPL-3.0</div><a href="/source.zip">Source &amp; license</a></div>
    </aside>

    <div class="content">
      <header class="topbar">
        <h1><svg class="logo topbar-logo" aria-hidden="true"><use href="#logo"/></svg><span id="title">Overview</span></h1>
        <div id="chips" class="chips" aria-live="polite"></div>
      </header>
      <aside id="update-notice" class="update-notice" aria-live="polite" aria-label="Software update available" hidden></aside>
      <div id="status" class="import-status" role="status" aria-live="polite"></div><main id="view"></main>
    </div>
  </div>

  <template id="player-tpl">
    <section class="player cinema-viewer" aria-label="Dashcam viewer">
      <div class="viewer-stage">
        <div id="cams" class="cams"></div>
        <time id="viewer-time" class="viewer-time"></time>
        <div id="viewer-telemetry" class="viewer-hud" aria-label="Recorded vehicle telemetry">
          <div class="hud-grid">
            <span id="hud-gear" class="hud-dot hud-gear" title="Recorded gear">—</span>
            <div class="hud-speed">
              <svg id="hud-left" class="hud-blinker" viewBox="0 0 24 24" aria-label="Left turn signal"><path d="M3 12 11 4.5V9h10v6H11v4.5z"/></svg>
              <strong id="hud-speed">—</strong>
              <svg id="hud-right" class="hud-blinker" viewBox="0 0 24 24" aria-label="Right turn signal"><path d="M21 12 13 4.5V9H3v6h10v4.5z"/></svg>
            </div>
            <span id="hud-steering" class="hud-dot hud-steering" title="Recorded steering wheel angle"><svg id="hud-wheel" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M3.6 10.6c2.6-.9 5.4-1.3 8.4-1.3s5.8.4 8.4 1.3M10 13.2h4M12 13.2v7.4"/><circle cx="12" cy="12.4" r="1.6" class="hub"/></svg></span>
            <span id="hud-brake" class="hud-dot hud-pedal" title="Recorded brake"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 10 11" class="stalk"/><rect x="5" y="11" width="14" height="8" rx="2.2"/></svg></span>
            <button id="hud-unit" type="button" title="Switch between MPH and km/h">MPH</button>
            <span id="hud-throttle" class="hud-dot hud-pedal" title="Recorded accelerator"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3.5 12 7" class="stalk"/><rect x="9" y="7" width="7" height="13.5" rx="2"/></svg></span>
          </div>
          <div id="hud-assist" class="hud-assist" hidden></div>
          <span id="hud-status" class="hud-status">Reading recorded telemetry…</span>
        </div>
        <div class="viewer-actions">
          <button id="viewer-info" type="button" class="icon-btn" aria-label="Clip details and telemetry" aria-controls="viewer-details" aria-expanded="false" title="Clip details and telemetry"><svg><use href="#i-gear"/></svg></button>
          <button id="viewer-fullscreen" type="button" class="icon-btn" aria-label="Enter fullscreen" title="Enter fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
          <a id="viewer-download" class="icon-btn" aria-label="Download selected camera" title="Download selected camera"><svg><use href="#i-download"/></svg></a>
          <a id="back" class="icon-btn" aria-label="Close viewer" title="Close viewer"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></a>
        </div>
        <aside id="viewer-details" class="viewer-details" aria-label="Clip details" hidden>
          <div class="player-head"><div class="player-titles"><h2 id="player-title"></h2><p id="player-sub" class="muted"></p></div></div>
          <h3>Recorded vehicle data</h3><dl id="telemetry-details" class="kv"></dl>
          <h3>Choose a minute</h3><div class="strip" id="clip-strip"></div>
          <details class="panel downloads"><summary><svg><use href="#i-download"/></svg> Downloads</summary><div id="downloads" class="file-chips"></div></details>
        </aside>
        <div class="controls">
          <button class="icon-btn" id="prev" type="button" title="Previous minute" aria-label="Previous minute"><svg><use href="#i-prev"/></svg></button>
          <button class="play-btn" id="play" type="button" title="Play / pause (space)" aria-label="Play"><svg><use href="#i-play"/></svg></button>
          <button class="icon-btn" id="next" type="button" title="Next minute" aria-label="Next minute"><svg><use href="#i-next"/></svg></button>
          <span id="clock" class="clock">--:--:--</span>
          <input id="scrub" type="range" min="0" max="0" step="0.1" value="0" aria-label="Position">
          <select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </div>
      </div>
      <div id="camera-rail" class="viewer-rail" role="toolbar" aria-label="Camera views"></div>
    </section>
  </template>


  <script src="/static/telemetry.js"></script>
  <script src="/static/glovebox-player.js"></script>
  <script src="/static/library.js"></script>
</body>
</html>
